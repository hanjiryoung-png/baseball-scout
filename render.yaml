services:
  - type: web
    name: baseball-scout
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: 3.13.5
    disk:
      name: baseball-scout-data
      mountPath: /var/data
      sizeGB: 1
